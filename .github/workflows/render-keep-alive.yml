name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        env:
          RENDER_URL: https://lua-license-control-panel-render.onrender.com/
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$RENDER_URL")
          echo "Render response: HTTP $status"
          test "$status" -ge 200
          test "$status" -lt 500
